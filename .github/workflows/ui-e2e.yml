name: UI E2E

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: ${{ github.event_name != 'workflow_dispatch' && github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            e2e:
              - 'ui/**'
              - 'tests/**'
              - 'openapi/**'
              - 'docker-compose*.yml'
              - 'versions.env'
              - '.github/workflows/ui-e2e.yml'

  e2e:
    name: e2e
    needs: changes
    if: ${{ !failure() && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: shellhub

      - name: Decide which editions can run
        id: editions
        run: |
          if [ "$EVENT" != pull_request ] || [ "$HEAD_REPO" = "$REPO" ]; then
              echo "list=community enterprise cloud" >> "$GITHUB_OUTPUT"
              echo "cloud=true" >> "$GITHUB_OUTPUT"
          else
              echo "list=community" >> "$GITHUB_OUTPUT"
              echo "::notice title=enterprise and cloud e2e skipped::a pull request from a fork cannot check out the private cloud source"
          fi
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}

      - name: Generate cloud repo token
        id: cloud-token
        if: steps.editions.outputs.cloud == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CLOUD_DISPATCH_APP_ID }}
          private-key: ${{ secrets.CLOUD_DISPATCH_APP_PRIVATE_KEY }}
          owner: shellhub-io
          repositories: cloud
          permission-contents: read

      - name: Determine cloud branch
        id: cloud-branch
        if: steps.editions.outputs.cloud == 'true'
        env:
          GH_TOKEN: ${{ steps.cloud-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$HEAD_REF" ] && gh api "repos/shellhub-io/cloud/branches/$HEAD_REF" >/dev/null 2>&1; then
            echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out cloud source
        if: steps.editions.outputs.cloud == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: shellhub-io/cloud
          token: ${{ steps.cloud-token.outputs.token }}
          ref: ${{ steps.cloud-branch.outputs.ref }}
          fetch-depth: 1
          path: cloud
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"

      - name: Restore node modules
        id: node-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: shellhub/ui/node_modules
          key: ${{ runner.OS }}-ui-${{ hashFiles('shellhub/ui/package-lock.json') }}

      - name: Install Node dependencies
        working-directory: shellhub/ui
        run: npm install

      - name: Generate OpenAPI client
        working-directory: shellhub/ui
        run: |
          VERSION=$(sed -n 's/^REDOCLY_VERSION=//p' ../versions.env)
          [ -n "$VERSION" ] || { echo "could not read REDOCLY_VERSION from versions.env"; exit 1; }
          npx "@redocly/cli@$VERSION" bundle ../openapi/spec/openapi.yaml -o /tmp/openapi.json --force
          OPENAPI_SPEC_PATH=/tmp/openapi.json npm run generate -w @shellhub/console

      - name: Restore Playwright browser
        id: playwright-browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.OS }}-playwright-${{ hashFiles('shellhub/ui/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: shellhub/ui
        run: npm run e2e:browsers -w @shellhub/console

      - name: Save node modules
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: shellhub/ui/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Save Playwright browser
        if: steps.playwright-browser.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-browser.outputs.cache-primary-key }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: shellhub/tests/go.mod
          cache: false

      - name: Restore the Go caches
        uses: ./shellhub/.github/actions/go-cache
        with:
          name: ui-e2e
          sum-files: shellhub/tests/go.sum

      - name: Restore the image build cache
        uses: ./shellhub/.github/actions/build-cache

      - name: Measure the image builds
        working-directory: shellhub
        env:
          SHELLHUB_E2E_RUN: measure
          SHELLHUB_CLOUD_SRC: ${{ github.workspace }}/cloud
        run: |
          stack="--env-file .env --env-file versions.env -f docker-compose.yml"
          test="-f docker-compose.test.yml -f docker-compose.postgres.test.yml -f docker-compose.test.build.yml"
          start=$(date +%s)
          build() {
              name=$1 edition=$2 service=$3
              shift 3
              SHELLHUB_BUILD_EDITION=$edition docker compose -p "measure-$name" $stack "$@" $test \
                  build --progress plain "$service" > "$RUNNER_TEMP/measure-$name.log" 2>&1
              status=$?
              echo "$name finished at $(( $(date +%s) - start ))s, exit $status"
          }
          build ui community ui &
          build gateway community gateway &
          build server-community community server &
          build server-enterprise enterprise server -f docker-compose.enterprise.yml &
          wait
          echo "total $(( $(date +%s) - start ))s"
          for name in ui gateway server-community server-enterprise; do
              echo "::group::$name steps over 1s"
              awk '/^#[0-9]+ \[/ { id = $1; sub(/^#[0-9]+ /, ""); n[id] = substr($0, 1, 110) }
                   /^#[0-9]+ DONE/ { t = $3; sub(/s$/, "", t); if (t + 0 >= 1) printf "%7.1fs %s\n", t, n[$1] }' \
                  "$RUNNER_TEMP/measure-$name.log" | sort -rn
              echo "::endgroup::"
          done

      - name: Run E2E tests
        working-directory: shellhub/ui
        timeout-minutes: 60
        env:
          EDITIONS: ${{ steps.editions.outputs.list }}
          E2E_RUNNER: host
          CLOUD_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          CLOUD_STRIPE_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}
          CLOUD_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
        run: |
          declare -A pids
          for edition in $EDITIONS; do
              prefix=$(printf '%-12s' "[$edition]")
              (
                  set -o pipefail
                  (
                      if [ "$edition" = cloud ]; then
                          export STRIPE_SECRET_KEY=$CLOUD_STRIPE_SECRET_KEY
                          export STRIPE_PRICE_ID=$CLOUD_STRIPE_PRICE_ID
                          export SHELLHUB_STRIPE_PUBLISHABLE_KEY=$CLOUD_STRIPE_PUBLISHABLE_KEY
                      fi
                      unset CLOUD_STRIPE_SECRET_KEY CLOUD_STRIPE_PRICE_ID CLOUD_STRIPE_PUBLISHABLE_KEY
                      E2E_EDITION=$edition E2E_STACK_NAME=e2e-$edition \
                          exec npm run e2e:test -w @shellhub/console
                  ) 2>&1 | tee "$RUNNER_TEMP/e2e-$edition.log" | sed -u "s/^/$prefix /"
              ) &
              pids[$edition]=$!
          done

          declare -A statuses
          for edition in $EDITIONS; do
              status=0
              wait "${pids[$edition]}" || status=$?
              statuses[$edition]=$status
          done

          failed=0
          for edition in $EDITIONS; do
              status=${statuses[$edition]}
              echo "::group::e2e ($edition) exited $status"
              cat "$RUNNER_TEMP/e2e-$edition.log"
              echo "::endgroup::"
              if [ "$status" -ne 0 ]; then
                  echo "::error title=e2e ($edition) failed::exit status $status"
                  failed=1
              fi
          done

          exit "$failed"

      - name: Save the Go caches
        if: ${{ !cancelled() }}
        uses: ./shellhub/.github/actions/go-cache
        with:
          name: ui-e2e
          sum-files: shellhub/tests/go.sum
          save: true

      - name: Upload Playwright report
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            shellhub/ui/apps/console/e2e/tmp
            shellhub/tests/.stack/*.log
            ${{ runner.temp }}/e2e-*.log
          include-hidden-files: true
          retention-days: 14
